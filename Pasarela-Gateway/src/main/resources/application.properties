spring.application.name=Pasarela-Gateway
server.port=8080

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8760/eureka
eureka.instance.prefer-ip-address=true

# Servicio01: Registro de equipos (:8761)
spring.cloud.gateway.server.webmvc.routes[0].id=servicio01-api
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://Servicio01
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/equipos,/api/equipos/**

spring.cloud.gateway.server.webmvc.routes[1].id=servicio01-html
spring.cloud.gateway.server.webmvc.routes[1].uri=${liga1.routes.servicio01-url:http://localhost:8761}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/equipos.html

